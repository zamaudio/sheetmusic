on:
  push:
    branches: [ master ]
jobs:
  musescore4:
    runs-on: ubuntu-latest
    container:
      image: archlinux/archlinux:latest
      env:
        QT_QPA_PLATFORM: offscreen
      volumes:
        - ${{ github.workspace }}:/opt/scores
    steps:
      - name: Install musescore 4.7.7 and generate pdfs
        uses: actions/checkout@v4
      - run: |
          pacman -Syyu --noconfirm
          pacman -U --noconfirm https://archive.archlinux.org/packages/m/musescore/musescore-4.7.7-1-x86_64.pkg.tar.zst
          pacman -S --noconfirm sed make tree
          cd /opt/scores && make && tree

      - name: Retain pdfs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: out/
          archive: false
