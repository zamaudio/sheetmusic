on:
  push:
    branches: [ master ]
jobs:
  musescore4:
    runs-on: ubuntu-latest
    steps:
      - name: Install musescore 3.x and generate pdfs
        uses: actions/checkout@v4
      - run: |
          export DEBIAN_FRONTEND=noninteractive
          sudo apt update
          sudo apt install -y --no-install-suggests xvfb wget libfuse2 libegl1 libopengl0 libjack-jackd2-0
          wget -O musescore.appimage https://github.com/musescore/MuseScore/releases/download/v3.6.2/MuseScore-3.6.2.548021370-x86_64.AppImage
          chmod +x musescore.appimage
          export PATH=$PATH:.
          export QT_LOGGING_RULES="qt.qml.typeregistration=false"
          timeout 180 xvfb-run -a make MSCORE=musescore.appimage

      - name: Retain pdfs
        uses: actions/upload-artifact@v7
        with:
          name: pdfs
          path: out/
